name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create Release with APK
        run: |
          set -x
          # 删除旧 release 和 tag
          gh api "repos/${{ github.repository }}/releases/tags/latest" -X DELETE 2>/dev/null || true
          gh api "repos/${{ github.repository }}/git/refs/tags/latest" -X DELETE 2>/dev/null || true
          # 创建新 release
          release_id=$(gh api "repos/${{ github.repository }}/releases" \
            -f tag_name="latest" \
            -f target_commitish="${{ github.sha }}" \
            -f name="Latest Build" \
            -f body="Auto-built debug APK from ${{ github.sha }}" \
            --jq '.id')
          echo "Release ID: $release_id"
          # 上传 APK
          gh api "repos/${{ github.repository }}/releases/$release_id/assets?name=ADBTool-debug.apk" \
            -X POST \
            -H "Content-Type: application/vnd.android.package-archive" \
            --input app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
